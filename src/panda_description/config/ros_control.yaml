controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Arm: position command interface. gazebo_ros2_control SetPosition = rigid/accurate tracking,
# no gravity-fight, no PID tuning needed. Gripper stays effort for contact force.
panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 2.0
      panda_joint1: {goal: 0.15}
      panda_joint2: {goal: 0.15}
      panda_joint3: {goal: 0.15}
      panda_joint4: {goal: 0.15}
      panda_joint5: {goal: 0.15}
      panda_joint6: {goal: 0.15}
      panda_joint7: {goal: 0.15}

# Gripper: effort command + PID gains.
# Position command (SetPosition) bypasses ODE physics — no contact normal force →
# no friction → object slips during lift. Effort+PID applies a real closing force
# (F = kp×error) that generates the normal force required for stable grasping.
panda_hand_controller:
  ros__parameters:
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    gains:
      # p=3000 N/m: at error=0.007m (beer_can: gripper 80mm, can dia 66mm → 7mm gap/finger)
      # → 21N → capped at URDF limit 20N → immediate full force from first control cycle
      # kd=20 damps closing oscillations; i accumulates for steady-state hold
      panda_finger_joint1: {p: 3000.0, i: 50.0, d: 20.0, i_clamp: 100.0}
      panda_finger_joint2: {p: 3000.0, i: 50.0, d: 20.0, i_clamp: 100.0}
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 5.0
      # 0.04 = max finger pos: JTC never aborts (blocked by object = within tolerance).
      # Without this, the JTC aborts when object blocks fingers at 7mm (> 5mm old tolerance),
      # drops effort to 0, and the gripper opens → object drops. With 0.04 tolerance,
      # PID continuously applies closing force regardless of object contact.
      panda_finger_joint1: {goal: 0.04}
      panda_finger_joint2: {goal: 0.04}
