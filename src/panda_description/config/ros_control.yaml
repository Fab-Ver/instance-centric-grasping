controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Arm: position command interface.
# gz/DART handles dynamics internally — no PID gains required.
# JTC forwards desired positions from MoveIt2 TOPP trajectory directly to gz.
panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0
      panda_joint1: {goal: 0.10}
      panda_joint2: {goal: 0.10}
      panda_joint3: {goal: 0.10}
      panda_joint4: {goal: 0.10}
      panda_joint5: {goal: 0.10}
      panda_joint6: {goal: 0.10}
      panda_joint7: {goal: 0.10}

# Gripper: effort command + PID gains — applies continuous closing force.
# PID ensures the finger applies gripping force even when blocked by an object.
# goal_tolerance=0.04 (max finger pos) so JTC never aborts on contact.
panda_hand_controller:
  ros__parameters:
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # i=0 (PD-only). The integral term, charged toward closing during a grasp, otherwise
    # dominates the open command at release and keeps the fingers clamped on the object (the
    # open never wins until the integral unwinds, which takes minutes). P alone gives ample,
    # size-scaling grip force for friction holding (~P*radius N) and the release inverts
    # instantly — object-size independent. See grasp_executor STEP 7 release handling.
    gains:
      panda_finger_joint1: {p: 3000.0, i: 0.0, d: 20.0, i_clamp: 100.0}
      panda_finger_joint2: {p: 3000.0, i: 0.0, d: 20.0, i_clamp: 100.0}
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 5.0
      panda_finger_joint1: {goal: 0.04}
      panda_finger_joint2: {goal: 0.04}
