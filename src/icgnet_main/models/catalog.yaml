# ICGNet object catalog — maps semantic class names to Gazebo model names.
# Classes match ICGNet SEMANTIC_CLASSES: mug=0, box=1, can=2, bottle=3, cylindric=4, ball=5, other=6
#
# Models marked [mesh] have real DAE/STL geometry (better for ICGNet pointcloud realism).
# Models marked [prim] are SDF primitives (cylinder/box/sphere), good for physics testing.
#
# Flat models (e.g. bowl, coke_can) live in models/<name>/ and use model:// URIs.
# Class-subdir models live in models/<class>/<name>/ and are loaded via -file with absolute path.

mug:
  class_id: 0
  models:
    - threshold_porcelain_coffee_mug  # [mesh] scanned model from Gazebo Fuel
box:
  class_id: 1
  models:
    - cardboard_box  # [prim] 74x68x90mm — graspable across 68mm face (12mm clearance vs 80mm gripper)
    # wood_cube (76x76x76mm) removed: only 4mm total clearance vs the 80mm gripper → effectively
    # ungraspable (ICGNet tip collision filter rejects it). Keeping it would conflate a physical size
    # limit with ICGNet's grasp-synthesis weakness on boxes, biasing the single-object eval.
can:
  class_id: 2
  models:
    - coke_can     # [mesh] real DAE from Gazebo DB — Coca-Cola can with texture
bottle:
  class_id: 3
  models:
    - cajun_tonic_bottle  # [mesh .obj] GSO from Gazebo Fuel (Weston Cajun Jerky Tonic, 12 fl oz)
    # water_bottle_fuel removed: its .glb mesh is NOT supported by gz-sim Fortress
    # ("Invalid mesh filename extension"). Replaced with this .obj-based GSO model.

cylindric:
  class_id: 4
  models:
    - pringles_can  # [prim] cylinder r=38mm h=220mm
ball:
  class_id: 5
  models:
    - tennis_ball   # [prim] sphere r=38mm (~230cm3), gap=38mm < max_finger_gap=40mm

