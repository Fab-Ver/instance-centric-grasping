grasp_executor_node:
  ros__parameters:
    rich_grasp_topic: '/icgnet/grasps_rich'
    compute_grasp_service: '/icgnet/compute_grasps'
    default_max_attempts: 5
    approach_offset: 0.12
    grasp_forward_offset: 0.045
    approach_velocity: 0.08
    approach_acceleration: 0.08
    lift_velocity: 0.15
    lift_acceleration: 0.12
    cartesian_fraction_threshold: 0.92
    cartesian_max_step_approach: 0.008
    pregrasp_settle_time: 0.8
    lift_height: 0.18
    workspace_x_min: 0.25
    workspace_x_max: 1.05
    workspace_y_min: -0.50
    workspace_y_max: 0.50
    workspace_z_min: 0.01
    workspace_z_max: 0.60
    object_entity_name: 'target_obj'
    object_init_x: 0.65
    object_init_y: 0.0
    object_init_z: 0.05

    # ── Collision scene integration ───────────────────────────────────────────
    # Master switch. Set false to disable all collision-scene logic (debug only).
    use_collision_scene: true

    # Finger links allowed to contact the target during approach and grasp.
    acm_allowed_links:
      - panda_leftfinger
      - panda_rightfinger
      - panda_hand

    # Must match grasp_service_node collision_id_prefix.
    collision_id_prefix: 'icgnet_inst_'

    # ── Gripper control ───────────────────────────────────────────────────────
    # Extra per-finger opening added to g.width/2 for the pre-grasp position (m).
    finger_safety_margin: 0.01

    # Hardware per-finger position limit; caps the pre-grasp opening (m).
    max_finger_pos: 0.04

    # If the finger gap is below this value the gripper is fully closed → missed grasp (m).
    min_finger_gap: 0.005

    # If the finger gap is above this value the gripper barely closed → object tipped/missed (m).
    # Raised to 0.040 (Panda hardware limit) to allow grasping balls up to r=39mm (78mm dia).
    # Catches gripper-controller-abort false positives: a valid grasp still closes ≥1mm past surface.
    max_finger_gap: 0.040

    # Thread pool size for MultiThreadedExecutor.
    executor_threads: 4

    # ── Grasp filtering ───────────────────────────────────────────────────────
    # Grasps wider than this are discarded (beyond Panda finger range) (m).
    max_grasp_width: 0.08

    # ── Arm velocity defaults ────────────────────────────────────────────────
    # Velocity/acceleration fraction used for home moves and after failure recovery.
    arm_default_velocity: 0.5
    arm_default_acceleration: 0.3
    # ── MoveIt2 planning parameters ──────────────────────────────────────────
    # Allowed planning time (s) per motion goal. 5s is sufficient for RRTConnect
    # in a scene with ICGNet collision objects; 0.5s (pymoveit2 default) is too tight.
    allowed_planning_time: 5.0

    # Number of planning attempts before declaring failure.
    num_planning_attempts: 10

    # ── ICGNet inference timeout ──────────────────────────────────────────────
    # Max seconds to wait for /icgnet/compute_grasps to return.
    # ICGNet with return_meshes=True (marching cubes) on a small GPU takes 20–60 s.
    inference_timeout: 120.0

    # Wall-clock cap per arm/gripper move. The arm JTC has goal_time=0.0 (never aborts),
    # so a goal that never settles (e.g. unstable HOME from a tilted post-miss pose) would
    # block wait_until_executed forever and freeze execute_grasp. On timeout the move is
    # cancelled and reported as failed, keeping unattended batches (evaluation) alive.
    # Normal moves take ~10 s at low RTF; 60 s leaves ample headroom.
    move_timeout: 60.0

    # ── Pick-and-place (Fase 5) ──────────────────────────────────────────────
    # Drop bin centre in world frame (must match drop_bin pose in icgnet_world.sdf).
    # y=-0.50: outside camera FOV (camera covers y ∈ [-0.35,0.35]) → no cloud pollution.
    place_x: 0.45
    place_y: -0.50

    # z of TCP at release — must clear the bin rim (bin_rim_height=0.10).
    # 0.26m leaves 16cm above the rim; works for can/box without object-specific tuning.
    place_release_z: 0.26

    # Cartesian descent from place_pre to place_release (m above place_release_z).
    place_pre_offset: 0.15

    # Bin geometry for MoveIt collision object (solid box up to the rim).
    bin_footprint: 0.30    # outer side length (m) — matches drop_bin in world.sdf
    bin_rim_height: 0.10   # wall height = top of MoveIt CO (m)
    bin_z_tolerance: 0.20  # z-margin above rim for in-bin check — tolerates piled/tilted objects (any pose counts)

    # z reached by joint-space transfer move (clears bin rim=0.10 + tallest object ~0.22m).
    # 0.35m gives 13cm clearance over a wine bottle; was 0.45 (over-conservative, no table present).
    transport_clear_z: 0.35

    # Velocity for transfer (Step 5, longest joint-space move) and lower (Step 6, Cartesian descent).
    # Velocity raised more than acceleration to limit slip on friction-only grasp.
    transport_velocity: 0.25
    transport_acceleration: 0.15

    # Cartesian retract height after release before returning HOME (m).
    # place_release_z=0.26 already 16cm above rim; 0.10 retract → TCP at 0.36m before HOME.
    safe_retract_height: 0.10

    # Weight (kg) of objects attached in MoveIt planning scene.
    attach_weight: 0.35

    # Max wall-clock seconds to wait for a fresh joint_state before gap reads.
    # At RTF≈0.03 with joint_states at 50Hz sim, one message arrives every ~0.67s wall.
    # 2.0s provides 3× margin.
    joint_state_fresh_timeout: 2.0

    # Number of fresh joint_state messages to accumulate after gripper open (Step 7)
    # before starting the retract move. Gives the object sim-time to fall free.
    # 20 states ≈ 0.4s sim at 50Hz; at RTF 0.03 = ~13s wall (acceptable for pick-and-place).
    release_settle_states: 20

    # ── Multi-object sweep (Fase 4) ───────────────────────────────────────────
    # Lateral Y spacing between per-instance bin slots during a multi-object sweep (m).
    # With bin_footprint=0.30m, up to 2 objects fit within ±0.12m of centre at this spacing.
    # Increase to 0.14 only if objects reliably fall within a smaller footprint.
    bin_slot_spacing: 0.12
