grasp_executor_node:
  ros__parameters:
    rich_grasp_topic: '/icgnet/grasps_rich'
    compute_grasp_service: '/icgnet/compute_grasps'
    default_min_score: 0.5
    default_max_attempts: 5
    approach_offset: 0.10
    grasp_forward_offset: 0.04
    approach_velocity: 0.05
    approach_acceleration: 0.05
    lift_velocity: 0.10
    lift_acceleration: 0.10
    cartesian_fraction_threshold: 0.92
    cartesian_max_step_approach: 0.008
    cartesian_max_step_micro: 0.003
    pregrasp_settle_time: 0.8
    lift_height: 0.25
    workspace_x_min: 0.20
    workspace_x_max: 0.80
    workspace_y_min: -0.40
    workspace_y_max: 0.40
    workspace_z_min: 0.01
    workspace_z_max: 0.60
    object_entity_name: 'target_obj'
    object_init_x: 0.65
    object_init_y: 0.0
    object_init_z: 0.05

    # ── Collision scene integration ───────────────────────────────────────────
    # Master switch. Set false to disable all collision-scene logic (debug only).
    use_collision_scene: true

    # Weight (kg) assigned to the attached object after grasping.
    attach_weight: 0.2

    # Finger links allowed to contact the target during approach and grasp.
    acm_allowed_links:
      - panda_leftfinger
      - panda_rightfinger
      - panda_hand

    # Must match grasp_service_node collision_id_prefix.
    collision_id_prefix: 'icgnet_inst_'

    # ── Gripper control ───────────────────────────────────────────────────────
    # Extra per-finger opening added to g.width/2 for the pre-grasp position (m).
    finger_safety_margin: 0.01

    # Hardware per-finger position limit; caps the pre-grasp opening (m).
    max_finger_pos: 0.04

    # Seconds to wait after close command before reading the finger gap.
    gripper_read_settle: 0.3

    # If the finger gap is below this value the gripper is fully closed → missed grasp (m).
    min_finger_gap: 0.005

    # Thread pool size for MultiThreadedExecutor.
    executor_threads: 4

    # ── Grasp filtering ───────────────────────────────────────────────────────
    # Grasps wider than this are discarded (beyond Panda finger range) (m).
    max_grasp_width: 0.08

    # ── Arm velocity defaults ────────────────────────────────────────────────
    # Velocity/acceleration fraction used for home moves and after failure recovery.
    arm_default_velocity: 0.5
    arm_default_acceleration: 0.5
