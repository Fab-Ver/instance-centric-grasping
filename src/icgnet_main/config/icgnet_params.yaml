icgnet_grasp_node:
  ros__parameters:
    # EDIT ONCE — install-specific paths.
    # Absolute path to the ICGNet checkpoint config.yaml (~ expansion supported).
    config_path: "~/Robotics_Project/instance-centric-grasping/icgnet_weights/config.yaml"

    # Root of the cloned icg_net repository.
    icgnet_repo_path: "~/icg_net"

    # PointCloud2 topic from the Gazebo RGB-D camera
    camera_topic: "/camera/rgbd_camera/points"

    # Target frame for cloud transform before inference.
    # ICGNet requires the cloud in world frame (ground plane at z=0).
    target_frame: "world"

    # Voxel size for pre-inference downsampling (m).
    # ICGNet paper uses 2mm; 3mm is a safe margin before the internal 5mm requantization.
    voxel_size: 0.003

    # Number of grasps to generate per scene
    n_grasps: 32
    # Upstream grasp score cull inside ICGNet. 0.0 = disabled (model default is 0.3): every
    # grasp is returned and ranked/tried high-to-low by the executor, nothing excluded a priori.
    grasp_score_threshold: 0.0

    # Workspace bounding box (world frame, metres).
    # Points outside are removed BEFORE passing to ICGNet. Objects spawn on the
    # table (z~0.05m top); z_min=0.01 keeps object points while excluding the
    # ground plane itself. Robot body (x<0.25) is excluded by x_min.
    workspace_x_min: 0.25
    workspace_x_max: 1.05
    workspace_y_min: -0.50
    workspace_y_max:  0.50
    workspace_z_min: 0.01
    workspace_z_max: 0.60

    # Collision objects (MoveIt2 planning scene)
    # Publish per-instance collision meshes reconstructed by ICGNet after each
    # /icgnet/compute_grasps call. MoveIt2 uses them for collision-aware planning.
    publish_collision_objects: true

    # Run marching cubes per-instance to extract meshes (adds ~0.5-2s on GPU).
    # Set false to disable collision publishing without touching publish_collision_objects.
    return_meshes: true

    # Collapse each reconstruction to its convex hull before publishing.
    # ~10-50x fewer triangles → faster FCL collision queries. Disable only if
    # concave geometry matters (e.g. mug with handle).
    collision_use_convex_hull: true

    # MoveIt2 planning scene collision topic (standard, do not change).
    collision_object_topic: "/collision_object"

    # Prefix for collision object IDs. Executor uses this to attach/detach by ID.
    collision_id_prefix: "icgnet_inst_"

    # Pointcloud preprocessing
    # Statistical outlier removal: number of neighbours to examine per point.
    pc_nb_neighbors: 20

    # Statistical outlier removal: points beyond this many std-devs are removed.
    pc_std_ratio: 2.0

    # Normal estimation search radius = voxel_size * pc_normal_radius_factor.
    pc_normal_radius_factor: 5.0

    # Normal estimation maximum neighbours within the search radius.
    pc_normal_max_nn: 30

    # Drop-bin exclusion (world frame)
    # Remove points inside the drop bin AABB before ICGNet inference so the bin
    # walls/floor do not appear as graspable instances. Must match place_x /
    # place_y / bin_footprint / bin_rim_height in grasp_executor_params.yaml.
    # z_max is set slightly above rim_height (0.10) to clip rim edge points.
    exclude_bin: true
    exclude_bin_x: 0.45
    exclude_bin_y: -0.50
    exclude_bin_footprint: 0.36
    exclude_bin_z_max: 0.12
